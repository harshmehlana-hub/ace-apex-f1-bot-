name: Discord commit notification\n\non:\n  push:\n    branches:\n      - fixed-v4-migration\n\njobs:\n  notify:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Send commit notification to Discord DM\n        env:\n          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}\n          COMMIT_SHA: ${{ github.sha }}\n          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}\n          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}\n          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}\n        run: |\n          set -euo pipefail\n\n          if [ -z "${DISCORD_BOT_TOKEN:-}" ]; then\n            echo "Missing DISCORD_BOT_TOKEN GitHub secret."\n            exit 1\n          fi\n\n          payload=$(python - <<'PY'\n          import json\n          print(json.dumps({"recipient_id": "1476246684752150528"}))\n          PY\n          )\n\n          dm=$(curl -fsS -X POST \\n            -H "Authorization: Bot ${DISCORD_BOT_TOKEN}" \\n            -H "Content-Type: application/json" \\n            https://discord.com/api/v10/users/@me/channels \\n            -d "$payload")\n\n          channel_id=$(python -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<< "$dm")\n\n          message_payload=$(python - <<'PY'\n          import json, os\n          message = os.environ["COMMIT_MESSAGE"].strip()\n          if len(message) > 1500:\n              message = message[:1497] + "..."\n          text = (\n              "🚀 **Ace's Apex production update**\n\n"\n              f"**Commit:** \\`{os.environ['COMMIT_SHA'][:7]}\\`\n"\n              f"**Message:** {message}\n"\n              f"**Author:** {os.environ['COMMIT_AUTHOR']}\n"\n              f"**Commit:** {os.environ['COMMIT_URL']}"\n          )\n          print(json.dumps({"content": text}))\n          PY\n          )\n\n          curl -fsS -X POST \\n            -H "Authorization: Bot ${DISCORD_BOT_TOKEN}" \\n            -H "Content-Type: application/json" \\n            "https://discord.com/api/v10/channels/${channel_id}/messages" \\n            -d "$message_payload"\n