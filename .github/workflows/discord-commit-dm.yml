name: Discord commit notification

on:
  push:
    branches:
      - fixed-v4-migration

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send commit notification to Discord DM
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
        run: |
          set -euo pipefail

          if [ -z "${DISCORD_BOT_TOKEN:-}" ] || [ -z "${DISCORD_USER_ID:-}" ]; then
            echo "Missing DISCORD_BOT_TOKEN or DISCORD_USER_ID GitHub secret."
            exit 1
          fi

          payload=$(python - <<'PY'
          import json, os
          message = os.environ["COMMIT_MESSAGE"].strip()
          if len(message) > 1500:
              message = message[:1497] + "..."
          text = (
              "🚀 **Ace's Apex production update**\n\n"
              f"**Commit:** \`{os.environ['COMMIT_SHA'][:7]}\`\n"
              f"**Message:** {message}\n"
              f"**Author:** {os.environ['COMMIT_AUTHOR']}\n"
              f"**Commit:** {os.environ['COMMIT_URL']}"
          )
          print(json.dumps({"recipient_id": os.environ["DISCORD_USER_ID"], "message": text}))
          PY
          )

          dm=$(curl -fsS -X POST \
            -H "Authorization: Bot ${DISCORD_BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            https://discord.com/api/v10/users/@me/channels \
            -d "$payload")

          channel_id=$(python -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<< "$dm")

          message_payload=$(python - <<'PY'
          import json, os
          message = os.environ["COMMIT_MESSAGE"].strip()
          if len(message) > 1500:
              message = message[:1497] + "..."
          text = (
              "🚀 **Ace's Apex production update**\n\n"
              f"**Commit:** \`{os.environ['COMMIT_SHA'][:7]}\`\n"
              f"**Message:** {message}\n"
              f"**Author:** {os.environ['COMMIT_AUTHOR']}\n"
              f"**Commit:** {os.environ['COMMIT_URL']}"
          )
          print(json.dumps({"content": text}))
          PY
          )

          curl -fsS -X POST \
            -H "Authorization: Bot ${DISCORD_BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://discord.com/api/v10/channels/${channel_id}/messages" \
            -d "$message_payload"
